name: Smplx-tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  SIMPLEX_VERSION: 0.2.0

jobs:
  simplex-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        toolchain: [ "1.91.0" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Use Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install simplex-cli
        uses: BlockstreamResearch/simplicityhl-toolchain@v0.0.3
        with:
          simplex: ${{ env.SIMPLEX_VERSION }}

      - name: Generate contract artifacts
        shell: bash
        run: |
          simplex build

      - name: Build
        run: |
          cargo build --workspace --all-features --verbose

      - name: Unit
        env:
          SIMPLEX_TEST_VERBOSE: ${{ runner.debug == '1' && '-v' || '' }}
        run: |
          simplex test --no-simplex --test-threads 4 "${SIMPLEX_TEST_VERBOSE}" -- --release

      - name: Fuzz
        env:
          SIMPLEX_TEST_VERBOSE: ${{ runner.debug == '1' && '-v' || '' }}
        run: |
          simplex test --fuzz --test-threads 4 "${SIMPLEX_TEST_VERBOSE}" -- --release

      # Each run draws a new seed: keep the persisted failing cases to reproduce them locally.
      - name: Upload fuzz failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures-${{ matrix.os }}
          path: fuzz-failures/
          if-no-files-found: ignore

      - name: Test
        env:
          SIMPLEX_TEST_VERBOSE: ${{ runner.debug == '1' && '-v' || '' }}
        run: |
          simplex test --test-threads 2 "${SIMPLEX_TEST_VERBOSE}" -- --release
